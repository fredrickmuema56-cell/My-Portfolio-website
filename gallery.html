<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gallery — Fredrick Muema Musyoki</title>
    <link rel="stylesheet" href="css/style.css"><link id="dark-theme" rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/theme.css"><script src="js/theme-init.js"></script>
  </head>
  <body data-page="gallery.html">
    <div class="page-bg bg-gallery"></div>
    <div id="three-bg"></div>
    <div id="site-header"></div>
    <main>
      <div class="container page-head">
        <div class="reveal"><span class="kicker">GALLERY / 06</span>
          <h1>Different contexts. <span class="accent">Same person.</span></h1>
        </div>
        <p class="lead reveal">A moving 3D portrait archive — different looks, angles and moments, with a little more dimension.</p>
      </div>
      <section class="section">
        <div class="container gallery-orbit-wrap">
          <div class="gallery-orbit-stage" aria-label="Interactive 3D photo gallery. Drag or swipe to rotate.">
            <div class="gallery-orbit-ring"></div>
          </div>
          <div class="gallery-orbit-controls" aria-label="Gallery controls">
            <button class="gallery-turn" type="button" data-turn="-1" aria-label="Rotate gallery left">&#8592;</button>
            <span class="gallery-control-hint">DRAG OR SWIPE TO EXPLORE</span>
            <button class="gallery-turn" type="button" data-turn="1" aria-label="Rotate gallery right">&#8594;</button>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script>document.addEventListener('DOMContentLoaded', () => {
  const files = [['images/profile/hero.jpeg', 'Formal / 01'], ['images/profile/home-hero.jpeg', 'Outdoors / 02'], ['images/profile/vest.jpeg', 'Waistcoat / 03'], ['images/profile/black-shirt.jpeg', 'Black shirt / 04'], ['images/profile/closeup.jpeg', 'Close-up / 05'], ['images/profile/casual-full.jpeg', 'Casual / 06'], ['images/profile/bucket-hat.jpeg', 'Everyday / 07'], ['images/profile/casual-orange.jpeg', 'Casual orange / 08'], ['images/profile/seated-orange.jpeg', 'Formal seated / 09'], ['images/profile/hoodie.jpeg', 'Hoodie / 10']];
  const stage = document.querySelector('.gallery-orbit-stage');
  const ring = stage?.querySelector('.gallery-orbit-ring');
  if (!stage || !ring) return;

  ring.innerHTML = files.map(([src, title], i) => `<figure class="gallery-item" style="--card-index:${i};--card-angle:${i * 36}deg" data-lightbox="${src}" data-title="${title}"><div class="gallery-card-inner"><img decoding="async" src="${src}" alt="Fredrick Musyoki — ${title}" loading="lazy"><figcaption>${title}</figcaption></div></figure>`).join('');

  // One shared transform drives the entire carousel. Pointer input works for
  // mouse, pen and touch; no per-card animation loops or external libraries.
  let angle = 0, dragging = false, lastX = 0, lastTime = 0, velocity = 0;
  let lastFrame = 0, frameId = 0, lastInteraction = 0;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lowPower = document.documentElement.classList.contains('low-power-device');
  const autoSpeed = reducedMotion ? 0 : (lowPower ? 0.0045 : 0.007); // degrees per ms
  const render = () => { ring.style.transform = `rotateY(${angle}deg)`; };
  const tick = (now) => {
    if (document.hidden) { frameId = requestAnimationFrame(tick); return; }
    if (!lastFrame) lastFrame = now;
    const elapsed = Math.min(now - lastFrame, 40);
    lastFrame = now;
    if (!dragging) {
      if (Math.abs(velocity) > 0.002) {
        angle += velocity * elapsed;
        velocity *= Math.pow(0.94, elapsed / 16.67);
      } else if (now - lastInteraction > 1600) {
        angle += autoSpeed * elapsed;
      }
      render();
    }
    frameId = requestAnimationFrame(tick);
  };
  const start = (event) => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    dragging = true; lastX = event.clientX; lastTime = performance.now(); velocity = 0;
    lastInteraction = lastTime; stage.classList.add('is-dragging');
    stage.setPointerCapture?.(event.pointerId);
  };
  const move = (event) => {
    if (!dragging) return;
    const now = performance.now(), dx = event.clientX - lastX, dt = Math.max(1, now - lastTime);
    angle += dx * 0.42;
    velocity = (dx * 0.42) / dt;
    lastX = event.clientX; lastTime = now; lastInteraction = now; render();
  };
  const end = () => { if (!dragging) return; dragging = false; stage.classList.remove('is-dragging'); lastInteraction = performance.now(); };
  stage.addEventListener('pointerdown', start);
  stage.addEventListener('pointermove', move);
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('lostpointercapture', end);
  stage.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault(); angle += event.key === 'ArrowLeft' ? -36 : 36;
      velocity = 0; lastInteraction = performance.now(); render();
    }
  });
  document.querySelectorAll('.gallery-turn').forEach((button) => button.addEventListener('click', () => {
    angle += Number(button.dataset.turn) * 36; velocity = 0;
    lastInteraction = performance.now(); render();
  }));
  stage.tabIndex = 0;
  stage.setAttribute('role', 'region');
  stage.setAttribute('aria-roledescription', 'interactive carousel');
  render(); frameId = requestAnimationFrame(tick);
  document.addEventListener('visibilitychange', () => { lastFrame = 0; });
});
</script><script src="js/main.js" defer></script><script src="js/scene.js" defer></script><script src="js/stars.js" defer></script><script src="js/theme.js" defer></script>
  </body>
</html>
