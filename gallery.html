<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A curated visual gallery of Fredrick Musyoki — formal, smart casual, and everyday portraits.">
  <meta name="theme-color" content="#07090d">
  <title>Gallery — Fredrick Musyoki</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body data-page="gallery.html">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-noise" aria-hidden="true"></div>
  <div id="site-header"></div>
  <main id="main-content">

<section class="page-hero section-shell reveal"><span class="section-kicker">GALLERY / 06</span><h1>Different contexts. <span class="accent-text">Same person.</span></h1><p>I wanted the gallery to show more than one version of me — formal, smart casual, outdoors, and just everyday Fredrick.</p></section>
<section class="section-shell gallery-grid section-pad">
  <button class="gallery-item gallery-wide reveal gallery-formal" type="button" data-lightbox="images/profile/bucket-hat.jpeg" data-title="Formal black suit portrait"><img src="images/profile/bucket-hat.jpeg" alt="Fredrick Musyoki wearing a dark suit and red tie in a modern office"></button>
  <button class="gallery-item reveal gallery-formal" type="button" data-lightbox="images/profile/hero.jpeg" data-title="Navy suit portrait"><img src="images/profile/hero.jpeg" alt="Fredrick Musyoki wearing a navy suit and red tie"></button>
  <button class="gallery-item reveal gallery-formal" type="button" data-lightbox="images/profile/seated-orange.jpeg" data-title="Navy suit portrait, full body"><img src="images/profile/seated-orange.jpeg" alt="Fredrick Musyoki in a navy suit and red tie"></button>
  <button class="gallery-item gallery-tall reveal gallery-formal" type="button" data-lightbox="images/profile/vest.jpeg" data-title="Waistcoat portrait"><img src="images/profile/vest.jpeg" alt="Fredrick Musyoki wearing a white shirt and dark waistcoat"></button>
  <button class="gallery-item reveal" type="button" data-lightbox="images/profile/black-shirt.jpeg" data-title="Black shirt portrait"><img loading="lazy" src="images/profile/black-shirt.jpeg" alt="Fredrick Musyoki in a black shirt and trousers"></button>
  <button class="gallery-item reveal" type="button" data-lightbox="images/profile/hoodie.jpeg" data-title="Outdoor portrait"><img loading="lazy" src="images/profile/hoodie.jpeg" alt="Fredrick Musyoki wearing a blue hoodie outdoors"></button>
  <button class="gallery-item gallery-wide reveal" type="button" data-lightbox="images/profile/casual-orange.jpeg" data-title="Casual seated portrait"><img loading="lazy" src="images/profile/casual-orange.jpeg" alt="Fredrick Musyoki seated indoors in a casual outfit"></button>
  <button class="gallery-item reveal" type="button" data-lightbox="images/profile/closeup.jpeg" data-title="Close portrait"><img loading="lazy" src="images/profile/closeup.jpeg" alt="Close portrait of Fredrick Musyoki"></button>
</section>

  </main>
  <div id="site-footer"></div>
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" data-close-lightbox></div>
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="Image preview">
      <button class="lightbox-close" type="button" aria-label="Close image preview" data-close-lightbox>×</button>
      <img id="lightboxImage" src="" alt="">
      <p id="lightboxTitle"></p>
    </div>
  </div>
  <script src="js/components.js" defer></script>
  <script src="js/animations.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
